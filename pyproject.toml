[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "biolit"
version = "0.1.22"
description = "LLM-assisted biomedical literature screening and structured extraction for PubMed and GEO."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Rachel Schwartz", email = "raschwaaa@gmail.com" }
]
requires-python = ">=3.8"
keywords = ["pubmed", "geo", "literature-review", "llm", "bioinformatics", "genomics", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "anthropic",
    "openai",
    "requests",
    "python-dotenv",
    "lxml",
    "pdfminer.six",
    "mcp[cli]",
]

[project.scripts]
biolit = "biolit.cli:main"
biolit-mcp = "biolit.mcp_server:main"

[tool.setuptools.packages.find]
include = ["biolit*"]

[project.urls]
Repository = "https://github.com/rachadele/biolit"
Homepage = "https://github.com/rachadele/biolit#readme"
Changelog = "https://github.com/rachadele/biolit/blob/main/CHANGELOG.md"
